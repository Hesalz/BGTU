worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 20443 ssl;
        server_name localhost;

        ssl_certificate     D:/nginx-1.30.4/nginx-1.30.4/conf/certs/localhost.crt;
        ssl_certificate_key D:/nginx-1.30.4/nginx-1.30.4/conf/certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = / {
            return 302 /TDWA03-01/TDWA03-01.html;
        }

        location /api/Save-JSON {
            proxy_pass http://127.0.0.1:40000/NGINX-test;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /TDWA03-01/ {
            alias D:/nginx-1.30.4/nginx-1.30.4/html/TDWA03-01/;
            index TDWA03-01.html;
        }

        location /TDWA02-02/ {
            alias D:/nginx-1.30.4/nginx-1.30.4/html/TDWA02-02/;
            index index.html;
            try_files $uri $uri/ /TDWA02-02/index.html;
        }
    }
}
