worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    keepalive_timeout 65;

    server {
        listen 20000;
        server_name localhost;

        location /api/Save-JSON {
            proxy_pass http://127.0.0.1:40000/NGINX-test;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /TDWA02-01/ {
            alias D:/nginx-1.30.4/nginx-1.30.4/html/TDWA02-01/;
            index TDWA02-01.html;
            try_files $uri $uri/ /TDWA02-01/TDWA02-01.html;
        }

        location /TDWA02-02/ {
            alias D:/nginx-1.30.4/nginx-1.30.4/html/TDWA02-02/;
            index index.html;
            try_files $uri $uri/ /TDWA02-02/index.html;
        }

        location = / {
            return 302 /TDWA02-01/;
        }
    }
}