<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Афиша кино - Контакты</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #eee;
        }

        header,
        footer {
            background-color: #1f1f1f;
            padding: 15px 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.7);
        }

        header h1 {
            margin: 0;
            font-weight: normal;
            color: #ff3d00;
            text-shadow: 0 0 5px #ff3d00;
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 50px;
            font-size: 0.9em;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: #ffc107;
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ff3d00;
            text-shadow: 0 0 8px #ff3d00;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h2 {
            color: #ff6f00;
            text-shadow: 0 0 3px #ff6f00;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ff3d00;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            color: #ffc107;
        }

        input,
        textarea {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            background: #333;
            color: #eee;
        }

        input:focus,
        textarea:focus {
            outline: 2px solid #ff6f00;
        }

        button {
            background: #ff3d00;
            border: none;
            padding: 12px 0;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background: #e63900;
        }

        .message {
            margin-top: 15px;
            color: #0f0;
            font-weight: bold;
            display: none;
            text-align: center;
        }

        .contact-info {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px #ff3d00;
            color: #ffc107;
        }

        .contact-info h3 {
            margin-top: 0;
            color: #ff6f00;
            text-shadow: 0 0 3px #ff6f00;
        }

        .contact-info p {
            margin: 8px 0;
            font-size: 1.05em;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <header>
        <h1>Афиша кино</h1>
        <nav>
            <a href="index.html">Главная</a>
            <a href="about.html">О проекте</a>
            <a href="contact.html">Контакты</a>
        </nav>
    </header>
    <main>
        <h2>Связаться с нами</h2>
        <form id="contactForm">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" required />
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />
            <label for="message">Сообщение:</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            <button type="submit">Отправить</button>
            <div class="message" id="successMessage">Спасибо за ваше сообщение!</div>
        </form>

        <section class="contact-info">
            <h3>Контакты администрации</h3>
            <p><strong>Телефон:</strong> +7 (495) 123-45-67</p>
            <p><strong>Email:</strong> admin@afisha-kino.ru</p>
            <p><strong>Адрес:</strong> г. Москва, ул. Кино, д. 10</p>
        </section>
    </main>
    <footer>© 2025 Афиша кино</footer>
    <script>
        const form = document.getElementById('contactForm');
        const successMsg = document.getElementById('successMessage');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            successMsg.style.display = 'block';
            form.reset();
            setTimeout(() => successMsg.style.display = 'none', 3000);
        });
    </script>
</body>

</html>
