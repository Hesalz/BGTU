<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/active_dialog.js"></script>
  <title>Эвакуатор - Принцип работы</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Verdana, sans-serif;
      background-color: #ecf0f1;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 30px;
    }

    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      margin-bottom: 25px;
      border-radius: 8px;
      background-color: #34495e;
      padding: 12px 0;
      transition: background-color 0.3s;
    }

    .burger-wrapper {
      display: none;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      margin: 0 5px;
      display: inline-block;
      font-weight: bold;
      font-size: 1.1em;
      transition: background-color 0.3s;
    }

    .nav-links a:hover {
      background-color: #2c3e50;
      border-radius: 5px;
    }

    @media screen and (max-width: 768px) {
      .menu-bar {
        background-color: transparent !important;
        padding: 0;
        border-radius: 0;
        margin-bottom: 15px;
      }

      .burger-wrapper {
        display: block;
        text-align: left;
        margin-bottom: 10px;
      }

      .burger {
        cursor: pointer;
        color: white;
        font-size: 2.5em;
        line-height: 1;
        display: inline-block;
        background-color: #34495e;
        padding: 10px 20px;
        border-radius: 8px;
        user-select: none;
        transition: background-color 0.3s;
      }

      .burger:hover {
        background-color: #2c3e50;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: #34495e;
        border-radius: 8px;
        overflow: hidden;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        width: 100%;
        padding: 15px 20px;
        margin: 0;
        border-top: 1px solid #2c3e50;
        text-align: center;
        box-sizing: border-box;
        color: white;
      }

      .nav-links a:first-of-type {
        border-top: none;
      }

      .nav-links a:hover {
        background-color: #2c3e50;
        border-radius: 0;
      }
    }

    h1 {
      color: #2c3e50;
      font-size: 2.5em;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    h2 {
      color: black;
      margin-top: 30px;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
      text-align: justify;
    }

    .image-block {
      text-align: center;
      margin: 30px 0;
    }

    .image-block img {
      max-width: 100%;
      height: auto;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
    }

    .figcaption {
      font-style: italic;
      color: #7f8c8d;
      margin-top: 8px;
    }

    ul {
      font-size: 1.2em;
      line-height: 1.8;
    }

    .video-block {
      text-align: center;
      margin: 30px 0;
    }

    .video-block video {
      width: 100%;
      max-width: 900px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      background: black;
    }

    .video-block .figcaption {
      font-style: italic;
      color: #7f8c8d;
      margin-top: 8px;
    }

    #dialog {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 420px;
      height: 600px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      z-index: 9999;
      font-family: Arial, sans-serif;
    }

    .dialog-header {
      background: #34495e;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .dialog-history {
      height: 380px;
      overflow-y: auto;
      background: #f7f9fa;
      padding: 15px;
    }

    .question {
      background: #3498db;
      color: white;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 10px 0;
      max-width: 80%;
      margin-left: auto;
      word-wrap: break-word;
    }

    .answer {
      background: #ecf0f1;
      color: black;
      padding: 12px 16px;
      border-radius: 18px;
      margin: 10px 0;
      max-width: 80%;
      word-wrap: break-word;
    }

    .dialog-input {
      padding: 15px;
      display: flex;
      gap: 10px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .dialog-input input {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .dialog-input button {
      border: none;
      background: #3498db;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
    }

    .dialog-input button:hover {
      background: #2980b9;
    }

    .voice-button {
      background: #2ecc71 !important;
    }

    .voice-button:hover {
      background: #27ae60 !important;
    }

    #dialogToggle {
      position: fixed;
      right: 25px;
      bottom: 25px;
      z-index: 10000;

      background: #3498db;
      color: white;

      border: none;
      border-radius: 18px;

      padding: 14px 22px;

      font-size: 18px;
      cursor: pointer;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.25);
    }

    #dialogToggle:hover {
      transform: scale(1.05);
    }

    #closeDialog {
      border: none;
      background: transparent;
      color: white;
      font-size: 20px;
      cursor: pointer;
      float: right;
    }

  </style>
</head>

<body onload="dialog_window()">
  <div class="container">
    <div class="menu-bar">
      <div class="burger-wrapper">
        <span class="burger" onclick="toggleMenu()">☰</span>
      </div>

      <div class="nav-links" id="navLinks">
        <a href="index.html">Главная</a>
        <a href="teoriya.html">Теория</a>
        <a href="opisanie.html">Описание</a>
        <a href="princip.html">Принцип работы</a>
        <a href="simulator.html">Симулятор</a>
        <!-- <a href="dialog.html">Диалог</a> -->
      </div>
    </div>

    <h1>Принцип работы эвакуатора</h1>

    <div class="video-block">

      <video controls width="100%" preload="metadata">

        <source src="./video/tow_truck.MOV" type="video/mp4">

        Ваш браузер не поддерживает видео.

      </video>

      <div class="figcaption">
        Видеоролик о принципе работы эвакуатора
      </div>

    </div>
    <script>
      function toggleMenu() {
        document.getElementById('navLinks').classList.toggle('active');
      }
    </script>
</body>

</html>
