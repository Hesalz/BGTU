<!DOCTYPE html
  PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Эвакуатор - Теория моделирования</title>
  <style type="text/css">
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Verdana, sans-serif;
      background-color: #ecf0f1;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 30px;
    }

    .menu-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      margin-bottom: 25px;
      border-radius: 8px;
      background-color: #34495e;
      padding: 12px 0;
      transition: background-color 0.3s;
    }

    .burger-wrapper {
      display: none;
    }

    .nav-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      margin: 0 5px;
      display: inline-block;
      font-weight: bold;
      font-size: 1.1em;
      transition: background-color 0.3s;
    }

    .nav-links a:hover {
      background-color: #2c3e50;
      border-radius: 5px;
    }

    @media screen and (max-width: 768px) {
      .menu-bar {
        background-color: transparent !important;
        padding: 0;
        border-radius: 0;
        margin-bottom: 15px;
      }

      .burger-wrapper {
        display: block;
        text-align: left;
        margin-bottom: 10px;
      }

      .burger {
        cursor: pointer;
        color: white;
        font-size: 2.5em;
        line-height: 1;
        display: inline-block;
        background-color: #34495e; 
        padding: 10px 20px;
        border-radius: 8px;
        user-select: none;
        transition: background-color 0.3s;
      }

      .burger:hover {
        background-color: #2c3e50;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        background-color: #34495e;
        border-radius: 8px;
        overflow: hidden;
      }

      .nav-links.active {
        display: flex;
      }

      .nav-links a {
        width: 100%;
        padding: 15px 20px;
        margin: 0;
        border-top: 1px solid #2c3e50;
        text-align: center;
        box-sizing: border-box;
        color: white;
      }

      .nav-links a:first-of-type {
        border-top: none;
      }

      .nav-links a:hover {
        background-color: #2c3e50;
        border-radius: 0;
      }
    }

    h1 {
      color: #2c3e50;
      font-size: 2.5em;
      border-bottom: 2px solid #3498db;
      padding-bottom: 10px;
    }

    h2 {
      color: black;
      margin-top: 30px;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
      text-align: justify;
    }

    .image-block {
      text-align: center;
      margin: 30px 0;
    }

    .image-block img {
      max-width: 100%;
      height: auto;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
    }

    .figcaption {
      font-style: italic;
      color: #7f8c8d;
      margin-top: 8px;
    }

    ul {
      font-size: 1.2em;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="menu-bar">
      <div class="burger-wrapper">
        <span class="burger" onclick="toggleMenu()">☰</span>
      </div>
      
      <div class="nav-links" id="navLinks">
        <a href="index.html">Главная</a>
        <a href="teoriya.html">Теория</a>
        <a href="opisanie.html">Описание</a>
        <a href="princip.html">Принцип работы</a>
        <a href="simulator.html">Симулятор</a>
        <a href="dialog.html">Диалог</a>
      </div>
    </div>

  <script>
    function toggleMenu() {
      document.getElementById('navLinks').classList.toggle('active');
    }
  </script>
</body>
</html>
