<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправка Email</title>
    <style>
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-wrapper {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        h2 {
            color: #2d3748;
            text-align: left;
            margin-bottom: 25px;
            font-weight: 600;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
            box-sizing: border-box;
        }

        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .submit-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #5a67d8;
        }
    </style>
</head>

<body>

    <div class="form-wrapper">
        <h2>Отправить email</h2>
        <form action="/" method="post">
            <label for="from">Отправитель:</label>
            <input type="email" id="from" name="from" placeholder="Введите ваш email" required>

            <label for="to">Получатель:</label>
            <input type="email" id="to" name="to" placeholder="Введите email получателя" required>

            <label for="message">Сообщение:</label>
            <textarea id="message" name="message" placeholder="Введите текст сообщения" required></textarea>

            <button type="submit" class="submit-btn">Отправить</button>
        </form>
    </div>

</body>

</html>
