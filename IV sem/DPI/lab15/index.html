<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="globals.css" />
  <link rel="stylesheet" href="styleguide.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="desktop">
    <div class="div">
      <input class="input" placeholder="Email" type="email" />
      <div class="group">
        <div class="overlap-group">
          <div class="div-wrapper">
            <div class="text-wrapper">Пароль</div>
          </div>
          <img class="eye-icon" src="img/eye.png" />
        </div>
      </div>
      <button class="btn">
        <div class="txt">Войти</div>
      </button>
      <div class="btn-g">
        <img class="google" src="img/google.png" />
        <div class="txt-btn">
          <div class="txt-2">Продолжить с Google</div>
        </div>
      </div>
      <div class="text-wrapper-2">Вход</div>
      <div class="view">
        <div class="text-wrapper-3">Logo</div>
        <div class="text-wrapper-4">Каталог</div>
        <div class="text-wrapper-5">Частные занятия</div>
        <div class="frame-wrapper">
          <div class="frame"><img class="account" src="img/user.png" /></div>
        </div>
        <div class="search">
          <img class="icon" src="img/search.png" />
          <div class="supporting-text">Поиск...</div>
        </div>
      </div>
      <div class="view-2">
        <div class="Logo">Logo</div>
        <div class="text">
          <p>Контакты</p>
          <p>Карта маршрутов</p>
          <p>Соглашение</p>
        </div>
        <div class="third-block">
          <div class="input-button">
            <input type="textbox" class="email" placeholder="Введите ваш email" />
            <button class="subscribe">Подписаться</button>
          </div>
          <div class="social-media">
            <p>Подпишись на полезную рассылку о новинках,<br> акциях и спецпредложениях</p>
            <div class="image">
              <image src="img/facebook.png" />
              <image src="img/insta.png" />
              <image src="img/telegram.png" />
              <image src="img/youtube.png" />
              <image src="img/vk.png" />
              <image src="img/twitter.png" />
            </div>
          </div>
        </div>
      </div>

      <p class="div-2">
        <span class="span"> Главная</span>
        <span class="text-wrapper-12">&nbsp;</span>
        <span class="text-wrapper-13">/ Личный кабинет</span>
        <span class="text-wrapper-12">/ Вход</span>
      </p>
      <img class="img" src="img/back.png" />
    </div>
  </div>
</body>

</html>
